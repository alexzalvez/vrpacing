name: build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Compile NIS and SMAA Compute Shaders
        shell: pwsh
        run: |
          fxc.exe /nologo /T cs_5_0 /E main /O3 /I third_party/nis /Fh src/gfx/shader_nis_upscale.h /Vn g_NISUpscaleShader third_party/nis/NIS_Upscale.hlsl
          fxc.exe /nologo /T cs_5_0 /E main /O3 /I src/smaa /Fh src/gfx/shader_smaa_edge.h /Vn g_SmaaEdgeShader src/smaa/smaa_edge_detection.hlsl
          fxc.exe /nologo /T cs_5_0 /E main /O3 /I src/smaa /Fh src/gfx/shader_smaa_blend.h /Vn g_SmaaBlendShader src/smaa/smaa_blend_weight.hlsl
          fxc.exe /nologo /T cs_5_0 /E main /O3 /I src/smaa /Fh src/gfx/shader_smaa_neighbor.h /Vn g_SmaaNeighborShader src/smaa/smaa_neighborhood_blend.hlsl
          Write-Host "Compute Shaders NIS y SMAA compilados exitosamente"

      - name: Configure
        run: cmake --preset windows-release -DVRPACING_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset windows-release --config Release

      - name: Test
        run: ctest --preset windows-release --output-on-failure -C Release

      - name: Stage artifact
        shell: pwsh
        run: |
          $out = "dist/VRPacing"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $required = @("VRPacingLayer.dll", "VRPacingHook.dll", "VRPacingTray.exe")
          foreach ($file in $required) {
              $found = Get-ChildItem -Path "build/windows-release" -Filter $file -Recurse | Select-Object -First 1
              if (-not $found) {
                  throw "Error critico: no se encontro el binario compilado $file en build/windows-release"
              }
              Copy-Item $found.FullName -Destination $out
          }

          $json = Get-ChildItem -Path "build/windows-release" -Filter "VRPacingLayer.json" -Recurse | Select-Object -First 1
          if ($json) { Copy-Item $json.FullName -Destination $out }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRPacing-windows-x64
          path: dist/VRPacing/
