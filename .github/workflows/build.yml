name: build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows-release -DVRPACING_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset windows-release --config Release

      - name: Test
        run: ctest --preset windows-release --output-on-failure -C Release

      - name: Stage artifact
        shell: pwsh
        run: |
          $out = "dist/VRPacing"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "build/windows-release/Release/VRPacingLayer.dll" -Destination $out -ErrorAction SilentlyContinue
          Copy-Item "build/windows-release/Release/VRPacingHook.dll" -Destination $out -ErrorAction SilentlyContinue
          Copy-Item "build/windows-release/Release/VRPacingTray.exe" -Destination $out -ErrorAction SilentlyContinue
          Copy-Item "build/windows-release/VRPacingLayer.json" -Destination $out -ErrorAction SilentlyContinue
          Copy-Item "scripts/*.ps1" -Destination $out -ErrorAction SilentlyContinue
          Compress-Archive -Path "$out/*" -DestinationPath "dist/VRPacing-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRPacing-windows-x64
          path: dist/VRPacing-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: VRPacing-windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VRPacing-windows-x64.zip
