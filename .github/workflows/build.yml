name: build

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSVC developer prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset windows-release -DVRPACING_BUILD_TESTS=ON

      - name: Build
        run: cmake --build --preset windows-release --config Release

      - name: Test
        run: ctest --preset windows-release --output-on-failure -C Release

      - name: Stage artifact
        shell: pwsh
        run: |
          $out = "dist/VRPacing"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $required = @("VRPacingLayer.dll", "VRPacingHook.dll", "VRPacingTray.exe")
          foreach ($file in $required) {
              $found = Get-ChildItem -Path "build/windows-release" -Filter $file -Recurse | Select-Object -First 1
              if (-not $found) {
                  throw "Error critico: no se encontro el binario compilado $file en build/windows-release"
              }
              Copy-Item $found.FullName -Destination $out
          }

          $json = Get-ChildItem -Path "build/windows-release" -Filter "VRPacingLayer.json" -Recurse | Select-Object -First 1
          if ($json) { Copy-Item $json.FullName -Destination $out }

          if (Test-Path "scripts") {
              Copy-Item "scripts/*.ps1" -Destination $out
          }

          Compress-Archive -Path "$out/*" -DestinationPath "dist/VRPacing-windows-x64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VRPacing-windows-x64
          path: dist/VRPacing-windows-x64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: VRPacing-windows-x64
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/VRPacing-windows-x64.zip
